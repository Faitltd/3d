<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAIT – Practical AI-powered tools that remove operational chaos.</title>
  <meta name="description" content="FAIT builds practical AI-powered tools and platforms that tame operational chaos—letting businesses focus on work, not overhead." />
  <link rel="canonical" href="https://3d.itsfait.com" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://3d.itsfait.com" />
  <meta property="og:title"       content="FAIT – Practical AI-powered tools that remove operational chaos." />
  <meta property="og:description" content="FAIT builds practical AI-powered tools and platforms that tame operational chaos—letting businesses focus on work, not overhead." />
  <meta property="og:image"       content="https://3d.itsfait.com/og-image.png" />

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:url"         content="https://3d.itsfait.com" />
  <meta name="twitter:title"       content="FAIT – Practical AI-powered tools that remove operational chaos." />
  <meta name="twitter:description" content="FAIT builds practical AI-powered tools and platforms that tame operational chaos—letting businesses focus on work, not overhead." />
  <meta name="twitter:image"       content="https://3d.itsfait.com/og-image.png" />

  <link rel="stylesheet" href="styles.css" />

  <!--
    Three.js r160 via importmap — no build step required.
    main.js uses:  import * as THREE from 'three';
                   import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  -->
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- Full-viewport Three.js canvas target -->
  <div id="scene-container" aria-hidden="true"></div>

  <!-- Fixed header — left side on desktop, full-width on mobile -->
  <header id="site-header">
    <div class="brand" aria-label="FAIT">FAIT</div>
    <p class="subtitle">Practical AI-powered tools that remove operational chaos.</p>
  </header>

  <!-- Sound toggle — positioned just left of the panel -->
  <button id="sound-toggle" aria-pressed="false" aria-label="Enable sound">
    <!-- Muted state icon -->
    <span class="icon-muted" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        <line x1="17" y1="7" x2="23" y2="17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </span>
    <!-- Active state icon -->
    <span class="icon-sound" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        <path d="M19 12c0 3.04-1.73 5.68-4.25 7l1.15 2c3.05-1.7 5.1-5 5.1-9s-2.05-7.3-5.1-9L14.75 5C17.27 6.32 19 8.96 19 12z"/>
      </svg>
    </span>
  </button>

  <!-- Project panel — right on desktop, bottom drawer on mobile -->
  <section id="project-panel" aria-label="Project details">

    <div class="panel-content">
      <div class="panel-header">
        <div class="project-index-label">Selected project</div>
        <h2 class="project-name" id="project-name"></h2>
      </div>

      <a id="project-link" href="#" target="_blank" rel="noopener" class="project-screenshot-link" aria-label="Visit site">
        <img id="project-screenshot" src="" alt="" class="project-screenshot" />
        <span class="screenshot-overlay">Visit site ↗</span>
      </a>

      <div class="case-study" role="region" aria-live="polite" aria-atomic="true">
        <div class="case-section">
          <h3>Problem</h3>
          <p id="cs-problem"></p>
        </div>
        <div class="case-section">
          <h3>Approach</h3>
          <p id="cs-approach"></p>
        </div>
        <div class="case-section">
          <h3>Outcome</h3>
          <p id="cs-outcome"></p>
        </div>
        <div class="case-section">
          <h3>Stack</h3>
          <p id="cs-stack" class="stack-list"></p>
        </div>
      </div>
    </div>

    <nav class="project-nav" aria-label="Cycle through projects">
      <button id="prev-btn" class="nav-btn" aria-label="Previous project">
        <span aria-hidden="true">&#8249;</span>
      </button>
      <span class="project-counter" id="project-counter" aria-live="polite">1 / 3</span>
      <button id="next-btn" class="nav-btn" aria-label="Next project">
        <span aria-hidden="true">&#8250;</span>
      </button>
    </nav>

  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
